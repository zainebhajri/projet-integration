# ============================================================
# GESTION FLOTTE - Configuration Spring Boot
# ============================================================

# --- Base de données MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_flotte?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Serveur ---
server.port=8080

# --- Désactiver la page de login Spring Security (on gère nous-mêmes) ---
spring.security.user.name=unused
spring.security.user.password=unused
